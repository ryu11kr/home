<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1c2433" />
    <title>UXPWA · 오프라인</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Pretendard", "Malgun Gothic", system-ui, sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f4f5f7;
        color: #111827;
      }
      main {
        width: min(28rem, calc(100% - 2rem));
        padding: 1.5rem;
        border-radius: 1.25rem;
        background: #fff;
        box-shadow: 0 8px 28px rgba(15, 23, 42, 0.06);
      }
      p {
        line-height: 1.6;
        color: #6b7280;
      }
      h1 {
        font-size: 1.35rem;
      }
      a {
        color: #2563eb;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>지금은 오프라인입니다</h1>
      <p>요청한 페이지가 캐시에 없습니다. 네트워크가 돌아오면 다시 열어 주세요.</p>
      <p><a href="./">UXPWA로 돌아가기</a></p>
    </main>
  </body>
</html>
